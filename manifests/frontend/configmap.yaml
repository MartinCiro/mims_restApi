apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config-1
  labels:
    app: frontend
    source: env-file
    instance: "1"
data:
  # Application Configuration
  APP_NAME: "Frontend E-commerce"
  APP_ENV: "production"
  APP_PORT: "3000"
  NODE_ENV: "production"
  
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "3000"
  HOSTNAME: "0.0.0.0"
  
  # API Configuration
  NEXT_PUBLIC_API_URL: "http://go-api-service-1:4000"
  NEXT_PUBLIC_API_BASE_PATH: "/api/v1"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  
  # Feature Flags
  NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
  NEXT_PUBLIC_ENABLE_MAINTENANCE: "false"
  
  # Application Settings
  LOG_LEVEL: "info"
  
  # Build Configuration
  NEXT_TELEMETRY_DISABLED: "1"