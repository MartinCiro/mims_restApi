apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment-1
  labels:
    instance: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
      instance: "1"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
        instance: "1"
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: frontend
        image: frontend:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - while true; do node server.js --hostname 0.0.0.0 || sleep 1; done
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        # Variables desde ConfigMap
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: APP_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: SERVER_PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: NODE_ENV
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: NEXT_PUBLIC_API_URL
        - name: NEXT_PUBLIC_SITE_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: NEXT_PUBLIC_SITE_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: LOG_LEVEL
              
        # Environment variables para Next.js
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: NEXT_TELEMETRY_DISABLED
        
        - name: HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: frontend-config-1
              key: SERVER_HOST

        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "300m"
            
        # Health checks mejorados para Next.js
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 2
          
        # Lifecycle hooks
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'Frontend started successfully'"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "echo 'Gracefully shutting down frontend' && sleep 5"]
              
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        # Volume mounts para caché
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
          readOnly: false

      volumes:
      - name: next-cache
        emptyDir: {}
        
      # Pod security context
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true