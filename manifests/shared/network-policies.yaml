apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  # Permitir entrada desde cualquier pod en el namespace
  - from:
    - podSelector: {}
    ports:
    - port: 3000
      protocol: TCP
  # Permitir entrada desde Traefik namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 3000
      protocol: TCP