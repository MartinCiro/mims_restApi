apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-prod-pv
  labels:
    type: local
    app: postgres
spec:
  capacity:
    storage: 5Gi  # ← Coherente con tu PVC de 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # ← CRÍTICO para producción
  storageClassName: local-storage
  local:
    path: /mnt/k8s-storage/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - localhost.localdomain
