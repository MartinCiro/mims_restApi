apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc-1
  labels:
    instance: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-storage
  selector:
    matchLabels:
      app: postgres
      instance: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc-1
  labels:
    instance: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
  selector:
    matchLabels:
      app: redis
      instance: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-data
  namespace: traefik
  labels:
    instance: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
  selector:
