apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-squid-to-traefik
  namespace: squid
spec:
  podSelector:
    matchLabels:
      app: squid
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP