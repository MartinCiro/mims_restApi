apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: squid
data:
  squid.conf: |
    http_port 3128
    cache_dir ufs /var/spool/squid 1000 16 256
    maximum_object_size 256 MB
    cache_mem 128 MB
    maximum_object_size_in_memory 512 KB
    
    # Logs
    access_log stdio:/dev/stdout
    cache_log stdio:/dev/stdout
    
    # Refresh patterns optimizados
    refresh_pattern -i \.(gif|png|jpg|jpeg|ico|svg|woff|woff2|ttf|eot)$ 1440 100% 10080 ignore-reload
    refresh_pattern -i \.(css|js)$ 1440 90% 10080
    refresh_pattern . 0 20% 4320
    
    # ACLs
    acl localnet src 10.0.0.0/8
    acl localnet src 172.16.0.0/12
    acl localnet src 192.168.0.0/16
    acl SSL_ports port 443
    acl Safe_ports port 80
    acl Safe_ports port 443
    
    http_access allow localnet
    http_access deny !Safe_ports
    http_access allow localhost
    http_access deny all
    
    # Forward to Traefik
    cache_peer traefik-service.traefik.svc.cluster.local parent 8080 0 no-query originserver
    never_direct allow all