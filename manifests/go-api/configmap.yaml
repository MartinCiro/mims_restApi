apiVersion: v1
kind: ConfigMap
metadata:
  name: go-api-config
data:
  # Application Configuration
  APP_NAME: "SoftCalFut API"
  APP_ENV: "Development"
  APP_PORT: "4000"                    # ← API en puerto 4000
  
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  
  # Database Configuration
  DB_HOST: "postgres-service"         # ← Nombre del Service de PostgreSQL
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "softcalfut_psql"

  # Redis Configuration
  REDIS_HOST: "redis-service"         # ← Nombre del Service de Redis
  REDIS_PORT: "6379"
  
  # JWT Configuration
  JWT_EXPIRES_IN: "24h"
  
  # Application Settings
  LOG_LEVEL: "debug"                  # ← Debug en desarrollo
  CORS_ALLOWED_ORIGINS: "*"