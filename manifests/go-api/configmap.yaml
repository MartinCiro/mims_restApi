apiVersion: v1
kind: ConfigMap
metadata:
  name: go-api-config-1
  labels:
    app: go-api
    source: env-file
    instance: "1"
data:
  # Application Configuration
  APP_NAME: "Template API - Instance 1"
  APP_ENV: ""
  APP_PORT: "4000"
  
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "4000"
  
  # Database Configuration
  HOST_DB: "postgres-service-1"
  PORT_DB: "5432"
  USER_DB: "postgres"
  NAME_DB: "myapp"
  
  # Redis Configuration
  REDIS_URL: "redis-service-1"
  REDIS_PORT: "6379"
  
  # JWT Configuration
  JWT_EXPIRES_IN: "24h"
  
  # Application Settings
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "*"
