apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
  - name: web
    port: 80
    targetPort: web
    nodePort: 30080
  - name: websecure
    port: 443
    targetPort: websecure
    nodePort: 30443
  - name: admin
    port: 8080
    targetPort: admin
    nodePort: 30808