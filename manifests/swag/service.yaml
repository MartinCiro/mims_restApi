apiVersion: v1
kind: Service
metadata:
  name: swag-service-1
spec:
  type: NodePort  # o LoadBalancer si tu proveedor lo soporta
  selector:
    app: swag
    instance: "1"
  ports:
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443  # Puerto para HTTPS
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080  # Puerto para HTTP