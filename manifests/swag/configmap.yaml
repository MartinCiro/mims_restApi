apiVersion: v1
kind: ConfigMap
metadata:
  name: swag-proxy-configs
  labels:
    app: swag
    generated-by: script
data:

  # VALIDACIÓN HTTP - NECESARIO PARA CERTIFICADOS REALES
  http-challenge.conf: |
    server {
        listen 80;
        listen [::]:80;
        server_name iyata.duckdns.org *.iyata.duckdns.org;
        
        # Challenge de Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /config/www;
            try_files $uri =404;
        }
        
        # Todo lo demás redirige a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

  go-api.subdomain.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.iyata.duckdns.org;
        
        include /config/nginx/ssl.conf;

        client_max_body_size 0;
        proxy_http_version 1.1;
        
        location = / {
            proxy_pass http://go-api-service:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /health {
            proxy_pass http://go-api-service:4000/health;
            proxy_set_header Host $host;
        }
    }

  www.subdomain.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.iyata.duckdns.org;
        
        include /config/nginx/ssl.conf;

        return 301 https://iyata.duckdns.org$request_uri;
    }

  default.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name iyata.duckdns.org;

        include /config/nginx/ssl.conf;
        return 301 https://www.iyata.duckdns.org$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        include /config/nginx/ssl.conf;
        return 301 https://www.iyata.duckdns.org$request_uri;
    }

    include /config/nginx/proxy-confs/*.subdomain.conf;
