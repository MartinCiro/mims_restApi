apiVersion: v1
kind: ConfigMap
metadata:
  name: swag-proxy-configs
  labels:
    app: swag
    generated-by: script
data:
  go-api.subdomain.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.iyata.duckdns.org;
        
        include /config/nginx/ssl.conf;
        
        client_max_body_size 0;
        
        # Forzar HTTP/1.1 para evitar problemas con HTTP/2
        proxy_http_version 1.1;
        
        # Configuración específica para la raíz
        location = / {
            proxy_pass http://go-api-service:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /health {
            proxy_pass http://go-api-service:4000/health;
            proxy_set_header Host $host;
        }
    }

  # Frontend futuro (placeholder por ahora)
  www.subdomain.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.iyata.duckdns.org;
        
        include /config/nginx/ssl.conf;
        
        # Por ahora, redirige al dominio principal
        return 301 https://iyata.duckdns.org$request_uri;
        
        # En el futuro, aquí irá el proxy al frontend:
        # location / {
        #     include /config/nginx/proxy.conf;
        #     set $upstream_app frontend-service;
        #     set $upstream_port 3000;
        #     proxy_pass http://$upstream_app:$upstream_port;
        # }
    }

  # Configuración por defecto - Redirige todo a www
  default.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name iyata.duckdns.org;
        
        include /config/nginx/ssl.conf;
        
        # Redirige el dominio principal a www
        return 301 https://www.iyata.duckdns.org$request_uri;
    }

    # Catch-all para cualquier otro subdominio no configurado
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        
        include /config/nginx/ssl.conf;
        
        # Redirige cualquier subdominio no configurado a www
        return 301 https://www.iyata.duckdns.org$request_uri;
    }
    include /config/nginx/proxy-confs/*.subdomain.conf;