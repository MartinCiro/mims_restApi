apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment-1
  labels:
    app: postgres
    tier: database
    instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      tier: database
      instance: "1"
  template:
    metadata:
      labels:
        app: postgres
        tier: database
        instance: "1"
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "myapp"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc-1