services:
  # Aplicación Spring Boot
  app:
    build:
      context: ./
    container_name: java-dev-app
    ports:
      - "8080:8080"
      - "5006:5006"
    volumes:
      - ./src:/app/src  
      - ./pom.xml:/app/pom.xml 
      - maven-repo:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev,docker
      - SPRING_DATASOURCE_URL=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=jdbc:mariadb://${DB_HOST}:3306/${DB_NAME}
    command: mvn spring-boot:run
    networks:
      - java-network

  redis:
    image: redis:7-alpine
    container_name: java-dev-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - java-network

  logs:
    image: grafana/loki:2.9.0
    container_name: java-dev-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - java-network

volumes:
  mariadb-data:
    driver: local
  maven-repo:
    driver: local
  redis-data:
    driver: local

networks:
  java-network:
    driver: bridge