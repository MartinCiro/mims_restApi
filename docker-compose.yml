services:
  app_backend:
    image: node:20
    container_name: template_backend
    build: .
    working_dir: /usr/src/app
    restart: always
    depends_on:
      - redis
    ports:
      - "3000:${PORT}"
    environment:
      - NODE_ENV=${env}
      - DB_HOST=${HOST_DB}  
      - DB_PORT=${PORT_DB}
      - DB_USER=${USER_DB}
      - DB_PASSWORD=${PASS_DB}
      - DB_NAME=${NAME_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRETO}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_SALT=${JWT_SALT}
      - env=${env}
      - DB_URL=postgresql://${USER_DB}:${PASS_DB}@${HOST_DB}:${PORT_DB}/${NAME_DB}
      
    volumes:
      - .:/usr/src/app
      - ./node_modules:/usr/src/app/node_modules
    networks:
      - docker_app_network
    command: ["sh", "-c", "npm install && yes | npx prisma generate && npm run dev"]
    
  redis:
    image: redis:latest
    container_name: redis_service_t
    restart: unless-stopped
    networks:
      - docker_app_network
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env

volumes:
  redis_data:
    driver: local

networks:
  docker_app_network:
    driver: bridge