services:
  app_backend:
    build: .
    container_name: go_backend
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${USER_DB:-postgres} 
      - DB_PASSWORD=${PASS_DB:-password}
      - DB_NAME=${NAME_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - JWT_SECRET=${JWT_SECRETO}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_SALT=${JWT_SALT}
      - ENV=${ENV:-development}
      - PORT=8080
    networks:
      - docker_app_network

  redis:
    image: redis:latest
    container_name: redis_service-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"] 
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - docker_app_network
    ports:
      - ${REDIS_PORT}:6379
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $$REDIS_PASSWORD
      else
        redis-server
      fi"
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres-service-1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      POSTGRES_USER: ${USER_DB}
      POSTGRES_PASSWORD: ${PASS_DB}
      POSTGRES_DB: ${NAME_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docker_app_network
    ports:
      - "5433:5432"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  docker_app_network:
    driver: bridge